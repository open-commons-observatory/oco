[package]
name = "oco"
version = "0.1.0"
edition = "2021"
description = "The Open Commons Observatory's engine: the mark, discovery, the harvest, the site"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "2"
